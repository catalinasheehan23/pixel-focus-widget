<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pixel Focus Progress</title>
<style>
  :root{
    --cream:#EDCE9D;
    --paper:#F7E8C8;
    --terracotta:#B06B53;
    --terracotta-dark:#8C503E;
    --olive:#66734D;
    --brown:#6F4938;
    --empty:#E7D5B6;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    min-height:100vh;
    display:grid;
    place-items:center;
    background:transparent;
    font-family:"Courier New", Courier, monospace;
    color:var(--brown);
  }
  .widget{
    width:min(420px,96vw);
    background:var(--paper);
    border:3px solid var(--brown);
    box-shadow:6px 6px 0 rgba(111,73,56,.22);
    padding:18px 20px 16px;
  }
  .top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    margin-bottom:12px;
  }
  .title{
    font-weight:700;
    letter-spacing:1px;
    font-size:15px;
    text-transform:uppercase;
  }
  .count{
    color:var(--terracotta-dark);
    font-weight:700;
    font-size:14px;
    white-space:nowrap;
  }
  .track{
    height:26px;
    background:var(--empty);
    border:3px solid var(--brown);
    padding:3px;
    position:relative;
    overflow:hidden;
  }
  .fill{
    height:100%;
    width:0%;
    background:
      repeating-linear-gradient(
        90deg,
        var(--terracotta) 0 18px,
        var(--terracotta) 18px 20px,
        var(--terracotta-dark) 20px 22px
      );
    transition:width .25s steps(4,end);
  }
  .footer{
    margin-top:12px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
  }
  .message{
    font-size:12px;
    color:var(--olive);
    min-height:16px;
  }
  .controls{
    display:flex;
    gap:7px;
  }
  button{
    font:inherit;
    font-weight:700;
    border:2px solid var(--brown);
    background:var(--cream);
    color:var(--brown);
    min-width:34px;
    height:30px;
    cursor:pointer;
    box-shadow:2px 2px 0 rgba(111,73,56,.2);
  }
  button:hover{background:#F2DDB4}
  button:active{transform:translate(1px,1px);box-shadow:1px 1px 0 rgba(111,73,56,.2)}
  .leaf{color:var(--terracotta);margin-right:6px}
</style>
</head>
<body>
  <section class="widget" aria-label="Focus progress widget">
    <div class="top">
      <div class="title"><span class="leaf">🍂</span>Focus Progress</div>
      <div class="count" id="count">0 / 4 sessions</div>
    </div>
    <div class="track" role="progressbar" aria-valuemin="0" aria-valuemax="4" aria-valuenow="0">
      <div class="fill" id="fill"></div>
    </div>
    <div class="footer">
      <div class="message" id="message">one session at a time ♡</div>
      <div class="controls">
        <button id="minus" type="button" aria-label="Remove one completed session">−</button>
        <button id="plus" type="button" aria-label="Add one completed session">+</button>
        <button id="reset" type="button" aria-label="Reset progress">↺</button>
      </div>
    </div>
  </section>
<script>
  const GOAL = 4;
  const storageKey = "pixel-focus-progress";
  let completed = Number(localStorage.getItem(storageKey) || 0);
  completed = Math.max(0, Math.min(GOAL, completed));
  const fill = document.getElementById("fill");
  const count = document.getElementById("count");
  const message = document.getElementById("message");
  const track = document.querySelector(".track");

  function render(){
    const pct = (completed / GOAL) * 100;
    fill.style.width = pct + "%";
    count.textContent = completed + " / " + GOAL + " sessions";
    track.setAttribute("aria-valuenow", completed);
    if (completed === 0) message.textContent = "one session at a time ♡";
    else if (completed === 1) message.textContent = "nice start 🍁";
    else if (completed === 2) message.textContent = "halfway there ☕";
    else if (completed === 3) message.textContent = "one more! ✦";
    else message.textContent = "focus goal complete ♡";
    localStorage.setItem(storageKey, completed);
  }

  document.getElementById("plus").addEventListener("click", function(){
    if (completed < GOAL) completed++;
    render();
  });
  document.getElementById("minus").addEventListener("click", function(){
    if (completed > 0) completed--;
    render();
  });
  document.getElementById("reset").addEventListener("click", function(){
    completed = 0;
    render();
  });

  render();
</script>
</body>
</html>
